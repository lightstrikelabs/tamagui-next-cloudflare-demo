name: Deploy to Cloudflare

on:
  push:
    branches: [main, staging]
    paths:
      - 'apps/next/**'
  pull_request:
    branches: [main, staging]
    paths:
      - 'apps/next/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare
        id: deploy
        run: |
          cd apps/next
          DEPLOY_OUTPUT=$(pnpm run deploy 2>&1)
          echo "deploy_output<<EOF" >> $GITHUB_OUTPUT
          echo "$DEPLOY_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "$DEPLOY_OUTPUT"

      - name: Comment deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const environment = '${{ github.ref_name == 'main' && 'production' || 'staging' }}';
            const deployOutput = '${{ steps.deploy.outputs.deploy_output }}';

            // Try to extract URL from deploy output
            let deploymentUrl = '';
            const urlMatch = deployOutput.match(/https:\/\/[^\s]+\.workers\.dev/);
            if (urlMatch) {
              deploymentUrl = urlMatch[0];
            }

            // Build comment without leading indentation
            const lines = [
              '🚀 **Deployment Complete!**',
              '',
              `**Environment:** ${environment}`,
              `**Branch:** \`${{ github.head_ref }}\``,
              `**Commit:** \`${{ github.sha }}\``
            ];
            let comment = lines.join('\n');

            if (deploymentUrl) {
              comment += `\n\n**Deployment URL:** ${deploymentUrl}`;
            } else {
              comment += `\n\nYour changes have been deployed to Cloudflare. Check your Cloudflare dashboard for the deployment URL.`;
            }

            comment += `\n\n---\n*Deployed by GitHub Actions*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });